<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Agrima 💖</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Georgia, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #fff1f7, #eee9ff 70%, #ffeaf2);
    }

    .stage {
      position: relative;
      width: min(100vw, 900px);
      aspect-ratio: 9 / 7;
      overflow: hidden;
      background: linear-gradient(#fff1f7, #e5dcff);
      box-shadow: 0 25px 80px #62416b30;
    }

    canvas { width: 100%; height: 100%; display: block; }

    .birthday-title {
      position: absolute;
      bottom: 3%;
      left: 0;
      right: 0;
      color: #a53f70;
      text-align: center;
      font-size: clamp(18px, 4vw, 31px);
      font-weight: bold;
      opacity: 0;
      transform: translateY(8px);
      transition: .8s ease;
      pointer-events: none;
    }

    .birthday-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .shade {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #39264055;
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .6s ease, visibility .6s;
    }

    .shade.visible {
      opacity: 1;
      visibility: visible;
    }

    .popup {
      width: min(390px, 100%);
      padding: 28px 24px 25px;
      border-radius: 28px;
      background: #fff7fb;
      color: #793e69;
      text-align: center;
      box-shadow: 0 18px 65px #39264040;
      touch-action: none;
      user-select: none;
    }

    .heart { font-size: 34px; margin-bottom: 8px; }
    h1 { margin: 0 0 10px; font-size: clamp(25px, 7vw, 32px); }
    .hint { margin: 0; color: #906b89; font: 16px/1.5 system-ui, sans-serif; }

    .swipe-icon {
      display: block;
      margin: 16px auto 0;
      color: #d45d91;
      font: 34px/1 system-ui, sans-serif;
      animation: nudge 1.15s ease-in-out infinite;
    }

    @keyframes nudge {
      0%, 100% { transform: translateY(-3px); }
      50% { transform: translateY(7px); }
    }

    .next-button {
      display: block;
      margin: 20px auto 0;
      padding: 13px 25px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #e66f9f, #ba68c8);
      color: white;
      font: bold 16px system-ui, sans-serif;
      cursor: pointer;
    }

    .next-button[hidden] { display: none; }

    @media (max-width: 560px) {
      .stage { width: 100vw; }
    }
  </style>
</head>

<body>
  <main class="stage">
    <canvas id="bouquet" width="900" height="700"></canvas>
    <div class="birthday-title" id="birthdayTitle">
      Happy Birthday bbg (Agrima) ♥
    </div>
  </main>

  <div class="shade" id="shade">
    <section class="popup" id="popup">
      <div class="heart">💖</div>
      <h1 id="popupTitle">Swipe down bbg</h1>
      <p class="hint" id="popupHint">Swipe down on this card to open your surprise</p>
      <span class="swipe-icon" id="swipeIcon">↓</span>
      <button class="next-button" id="nextButton" type="button" hidden>
        Next Page
      </button>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("bouquet");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const pinks = ["#ff668f", "#ff8eab", "#ffadc3", "#ffd0de"];
    const whites = ["#fffdf8", "#fff3f8", "#ffe6ef", "#f5eaff"];
    const greens = ["#43875c", "#55a16c", "#70b77c", "#86c98b"];

    const flowers = [
      [250,300,"lily"], [295,230,"tulip"], [340,175,"lily"],
      [385,245,"tulip"], [430,155,"lily"], [475,225,"tulip"],
      [520,165,"lily"], [565,235,"tulip"], [610,300,"lily"],
      [310,340,"tulip"], [360,300,"lily"], [415,340,"tulip"],
      [465,310,"lily"], [520,345,"tulip"], [575,340,"lily"],
      [385,395,"tulip"], [455,400,"lily"], [525,395,"tulip"]
    ];

    const leaves = [
      [295,430,-20], [340,375,25], [380,455,20], [420,405,-25],
      [475,455,25], [515,405,-25], [565,450,25], [610,410,-20],
      [365,335,-25], [550,335,25], [430,365,25], [500,360,-25]
    ];

    function ovalPoints(cx, cy, rx, ry, degrees, count = 24) {
      const angle = degrees * Math.PI / 180;
      const points = [];

      for (let i = 0; i < count; i++) {
        const t = Math.PI * 2 * i / count;
        const x = rx * Math.cos(t);
        const y = ry * Math.sin(t);

        points.push([
          cx + x * Math.cos(angle) - y * Math.sin(angle),
          cy + x * Math.sin(angle) + y * Math.cos(angle)
        ]);
      }

      return points;
    }

    function polygon(points, fill, stroke = "") {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0], points[i][1]);
      }

      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();

      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function makeTargets() {
      const targets = [];

      function addEllipse(cx, cy, rx, ry, count, colors) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.sqrt(Math.random());

          targets.push({
            x: cx + Math.cos(angle) * rx * radius,
            y: cy + Math.sin(angle) * ry * radius,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      for (const [x, y, type] of flowers) {
        const colors = type === "lily" ? whites : pinks;

        for (let i = 0; i < 6; i++) {
          const angle = i * Math.PI / 3;
          addEllipse(
            x + Math.cos(angle) * 15,
            y + Math.sin(angle) * 15,
            18, 9, 7, colors
          );
        }

        addEllipse(x, y, 6, 6, 6, ["#ffd36b", "#ffe995"]);

        const baseX = 450 + (x - 450) * 0.22;
        for (let i = 0; i < 10; i++) {
          const t = Math.random();
          targets.push({
            x: baseX + (x - baseX) * t,
            y: 535 + (y + 18 - 535) * t,
            color: "#4b9b68"
          });
        }
      }

      for (const [x, y, degrees] of leaves) {
        const angle = degrees * Math.PI / 180;

        for (let i = 0; i < 9; i++) {
          const t = Math.random() * 2 - 1;
          const across = Math.random() * 2 - 1;

          targets.push({
            x: x + Math.cos(angle) * t * 28 - Math.sin(angle) * across * 8,
            y: y + Math.sin(angle) * t * 28 + Math.cos(angle) * across * 8,
            color: greens[Math.floor(Math.random() * greens.length)]
          });
        }
      }

      for (let i = 0; i < 120; i++) {
        const y = 490 + Math.random() * 120;
        const halfWidth = (y - 490) * 0.43 + 10;

        targets.push({
          x: 450 + (Math.random() * 2 - 1) * halfWidth,
          y,
          color: Math.random() < 0.5 ? "#f0a8c6" : "#ffd8e7"
        });
      }

      return targets;
    }

    const particles = makeTargets().map(target => ({
      startX: Math.random() * W,
      startY: Math.random() * H,
      target,
      radius: Math.random() < 0.8 ? 2 : 3
    }));

    function drawSparkles(time) {
      for (let i = 0; i < 90; i++) {
        const x = (i * 137.5 + 23) % W;
        const y = (i * 83.7 + 17) % H;

        ctx.globalAlpha = 0.28 + 0.42 * (
          0.5 + 0.5 * Math.sin(time / 600 + i)
        );

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, i % 4 === 0 ? 2 : 1.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function drawStem(x, y) {
      const baseX = 450 + (x - 450) * 0.22;

      ctx.beginPath();
      ctx.moveTo(baseX, 535);
      ctx.quadraticCurveTo((baseX + x) / 2 - 12, 390, x, y + 10);
      ctx.strokeStyle = "#43875c";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    function drawLeaf(x, y, degrees) {
      polygon(ovalPoints(x, y, 33, 11, degrees), "#65ad76", "#43875c");

      const angle = degrees * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(x - 27 * Math.cos(angle), y - 27 * Math.sin(angle));
      ctx.lineTo(x + 27 * Math.cos(angle), y + 27 * Math.sin(angle));
      ctx.strokeStyle = "#43875c";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawFlower(x, y, type) {
      const colors = type === "lily" ? whites : pinks;

      for (let i = 0; i < 6; i++) {
        const angle = i * Math.PI / 3;
        const px = x + Math.cos(angle) * 17;
        const py = y + Math.sin(angle) * 17;

        polygon(
          ovalPoints(px, py, 22, 12, i * 60),
          colors[Math.floor(Math.random() * colors.length)],
          "#ffffff"
        );
      }

      ctx.fillStyle = "#ffd36b";
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();

      if (type === "lily") {
        for (const degrees of [20, 90, 160]) {
          const angle = degrees * Math.PI / 180;
          const endX = x + Math.cos(angle) * 22;
          const endY = y + Math.sin(angle) * 22;

          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(endX, endY);
          ctx.strokeStyle = "#d88a2b";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = "#e6a543";
          ctx.beginPath();
          ctx.arc(endX, endY, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawWrapper() {
      polygon([[255,490],[645,490],[540,625],[360,625]], "#f3b5d0", "#d98cad");
      polygon([[255,490],[450,548],[645,490],[450,590]], "#ffdeeb", "#d98cad");

      ctx.beginPath();
      ctx.moveTo(450, 548);
      ctx.lineTo(450, 590);
      ctx.strokeStyle = "#e7a2bf";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Ribbon tails and bow
      polygon([[440,570],[385,610],[402,552]], "#d878a2", "#bf5d8a");
      polygon([[460,570],[515,610],[498,552]], "#d878a2", "#bf5d8a");

      ctx.fillStyle = "#e58bb1";
      ctx.strokeStyle = "#bf5d8a";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.ellipse(435, 568, 17, 15, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(465, 568, 17, 15, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#c75b89";
      ctx.beginPath();
      ctx.arc(450, 570, 11, 0, Math.PI * 2);
      ctx.fill();
    }

    function showPopup() {
      document.getElementById("birthdayTitle").classList.add("visible");

      setTimeout(() => {
        document.getElementById("shade").classList.add("visible");
      }, 700);
    }

    function drawFinishedBouquet() {
      for (const [x, y] of flowers) drawStem(x, y);
      for (const [x, y, angle] of leaves) drawLeaf(x, y, angle);
      drawWrapper();
      for (const [x, y, type] of flowers) drawFlower(x, y, type);

      showPopup();
    }

    let startedAt = null;

    function animate(time) {
      if (startedAt === null) startedAt = time;

      const progress = Math.min((time - startedAt) / 1900, 1);
      const eased = 1 - Math.pow(1 - progress, 3);

      ctx.clearRect(0, 0, W, H);
      drawSparkles(time);

      for (const particle of particles) {
        const x = particle.startX +
          (particle.target.x - particle.startX) * eased;
        const y = particle.startY +
          (particle.target.y - particle.startY) * eased;

        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time / 130 + x * 0.03);
        ctx.fillStyle = particle.target.color;
        ctx.beginPath();
        ctx.arc(x, y, particle.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        drawFinishedBouquet();
      }
    }

    requestAnimationFrame(animate);

    // Swipe down to reveal the button
    const popup = document.getElementById("popup");
    let swipeStartY = null;

    popup.addEventListener("pointerdown", event => {
      swipeStartY = event.clientY;
      popup.setPointerCapture(event.pointerId);
    });

    popup.addEventListener("pointerup", event => {
      if (swipeStartY === null) return;

      const swipeDistance = event.clientY - swipeStartY;
      swipeStartY = null;

      if (swipeDistance > 45) {
        document.getElementById("popupTitle").textContent = "Aww, you did it!";
        document.getElementById("popupHint").textContent =
          "Your next little surprise is ready 💕";
        document.getElementById("swipeIcon").hidden = true;
        document.getElementById("nextButton").hidden = false;
      }
    });

    popup.addEventListener("pointercancel", () => {
      swipeStartY = null;
    });

    // Opens bbg.html, which should be beside this file.
    document.getElementById("nextButton").addEventListener("click", () => {
      window.location.href = "bbg.html";
    });
  </script>
</body>
</html>
